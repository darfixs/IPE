<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minijuego Final - Boss Entry</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      font-family: 'Luckiest Guy', cursive;
      background: black;
      overflow: hidden;
      color: #ffe356;
      text-align: center;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
    }
    #boss-wrapper {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      animation: boss-entry 5s forwards;
    }
    #boss-wrapper img {
      width: 500px;
      max-width: 90vw;
      height: auto;
      filter: drop-shadow(0 0 30px red);
      border-radius: 10px;
    }
    #boss-message {
      margin-top: 40px;
      font-size: 2.5em;
      color: white;
      text-shadow: 0 0 12px red, 0 0 30px #ff0000;
      animation: appear-msg 5s ease-out forwards;
      opacity: 0;
      white-space: nowrap;
    }
    @keyframes boss-entry {
      0% { opacity: 0; transform: translate(-50%, -100%) scale(0.3); }
      20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      35% { transform: translate(-50%, -50%) scale(1); }
      65% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      85% { opacity: 0.7; }
      100% { opacity: 0; transform: translate(-50%, -40%) scale(1.3); }
    }
    @keyframes appear-msg {
      0%   { opacity: 0; transform: scale(0.8); }
      30%  { opacity: 1; transform: scale(1.1); }
      60%  { transform: scale(1); }
      100% { opacity: 0; }
    }

    #quiz-container, #quiz-summary {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      max-width: 700px;
      width: 90vw;
      background: radial-gradient(circle at center, #440000 80%, #000000 100%);
      padding: 2em;
      border-radius: 15px;
      box-shadow: 0 0 30px #ff6600;
      display: none;
    }
    #quiz-summary {
  font-family: 'Roboto', sans-serif;
  background: #1e1e1e;
  color: #e0e0e0;
  padding: 2em;
  border-radius: 15px;
  max-width: 800px;
  width: 90vw;
  box-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
  display: none;
  overflow-y: auto;
  max-height: 90vh;
  text-align: left;
}

#quiz-summary h1 {
  font-size: 2em;
  color: #ffe356;
  text-shadow: 0 0 4px rgba(255, 102, 0, 0.4);
  margin-bottom: 1em;
  text-align: center;
}

#summary-questions > div {
  margin-bottom: 2em;
  padding: 1.5em;
  background: #2a2a2a;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
}

#summary-questions h3 {
  font-size: 1.2em;
  margin-bottom: 1em;
  color: #f5f5f5;
  border-left: 5px solid #ffe356;
  padding-left: 10px;
}

.respuesta {
  font-size: 1em;
  padding: 10px 15px;
  margin: 0.4em 0;
  border-radius: 8px;
  background: #3a3a3a;
  color: #ddd;
  max-width: 100%;
  transition: background 0.3s;
}

.respuesta.correct {
  background: #6dbf73; /* verde suave */
  color: black;
  font-weight: 500;
}

.respuesta.incorrect {
  background: #d77b7b; /* rojo suave */
  color: black;
  font-weight: 500;
}

    .question-block button {
      font-family: 'Luckiest Guy', cursive;
      background: #ff9900;
      border: none;
      border-radius: 12px;
      padding: 0.7em 1.6em;
      margin: 0.6em auto;
      font-size: 1.4em;
      width: 80%;
      max-width: 350px;
      cursor: pointer;
      color: black;
      box-shadow: 0 4px 10px #ff6600;
    }
    .correct-answer {
      background-color: #6f6 !important;
      box-shadow: 0 0 10px #0f0;
    }
    .incorrect {
      background-color: #f88 !important;
      box-shadow: 0 0 10px red;
    }
    .question-failed {
      animation: shake 0.3s;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
    #exit-button {
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 2em;
    }
    #exit-button img {
      width: 200px;
      image-rendering: auto;
    }
    #exit-button div {
      font-size: 2em;
      color: yellow;
      font-family: 'Luckiest Guy', cursive;
      text-shadow: 2px 2px 5px red;
    }
  </style>
</head>
<body>

<!-- FUEGOS -->
<canvas id="fireCanvas"></canvas>

<!-- ENTRADA -->
<div id="boss-wrapper">
  <img src="https://i.pinimg.com/originals/84/4d/ae/844daeac49949d3040f6dafe0b9c2453.gif" alt="Boss Demonio" />
  <div id="boss-message">¿Crees que podrás conmigo?</div>
</div>

<!-- QUIZ -->
<div id="quiz-container"></div>

<div id="quiz-summary">
  <h1>Resumen del cuestionario</h1>
  <div id="summary-questions"></div>
  <button id="exit-button">
    <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExemxuNTNtemhxanU2c3N3a3BibmkyODB2bnNmemY5MTluZGJvbHR0MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/VAHK7iPBPUEwg/giphy.gif" alt="Salir Homer">
    <div>Salir del infierno...</div>
  </button>
</div>

<script>
  const canvas = document.getElementById('fireCanvas');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * W,
      y: H + Math.random() * 100,
      r: 2 + Math.random() * 3,
      d: 0.7 + Math.random() * 0.7,
      color: `rgba(255,${Math.floor(120 + Math.random() * 135)},0,0.7)`
    });
  }

  function drawParticles() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.shadowColor = 'rgba(255,120,0,0.7)';
      ctx.shadowBlur = 15;
      ctx.fill();
      p.y -= p.d;
      if (p.y < -10) {
        p.y = H + Math.random() * 100;
        p.x = Math.random() * W;
      }
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

const questions = [
  // Lugares de trabajo
  {
    question: "¿Qué aumenta el riesgo de caídas y accidentes en el lugar de trabajo de Homer?",
    answers: [
      "Buena iluminación y orden",
      "Cables por el suelo y pasillos estrechos",
      "Paredes pintadas de azul",
      "Mesas ergonómicas"
    ],
    correct: 1
  },
  {
    question: "¿Cuál es una medida preventiva para evitar accidentes en el puesto de trabajo?",
    answers: [
      "Ignorar la señalización",
      "Mantener los cables recogidos y los pasillos despejados",
      "Acumular cajas",
      "Dejar la limpieza para el final del mes"
    ],
    correct: 1
  },

  // Equipos de trabajo
  {
    question: "¿Qué puede provocar el uso inadecuado de regletas y enchufes?",
    answers: [
      "Crecimiento personal",
      "Ahorro energético",
      "Cortocircuitos e incendios",
      "Mejor rendimiento del ordenador"
    ],
    correct: 2
  },
  {
    question: "¿Qué debe hacerse para evitar riesgos eléctricos al usar equipos informáticos?",
    answers: [
      "Sobre cargar regletas",
      "Revisar enchufes y desconectar equipos fuera de uso",
      "Usar cualquier cable viejo",
      "No realizar mantenimiento"
    ],
    correct: 1
  },

  // Instalaciones eléctricas
  {
    question: "¿Por qué es peligroso manipular enchufes defectuosos o cables pelados?",
    answers: [
      "Podrías perder tiempo",
      "No pasa nada si tienes cuidado",
      "Riesgo de electrocución o incendio",
      "Son más baratos"
    ],
    correct: 2
  },
  {
    question: "¿Quién debe reparar las instalaciones eléctricas en la oficina?",
    answers: [
      "Cualquier trabajador",
      "Personal cualificado o técnico",
      "El jefe de recursos humanos",
      "El equipo de marketing"
    ],
    correct: 1
  },

  // Incendios
  {
    question: "¿Qué situación puede provocar un incendio en la sala de servidores?",
    answers: [
      "Equipos con buena ventilación y sin papeles cerca",
      "Acumular papeles cerca de regletas y equipos sin ventilar",
      "Revisar enchufes a diario",
      "Usar solo extintores"
    ],
    correct: 1
  },
  {
    question: "¿Cuál es una medida eficaz para prevenir incendios?",
    answers: [
      "Desconectar el WiFi",
      "Revisar regletas y tener extintores específicos",
      "Apilar objetos inflamables",
      "Ignorar detectores de humo"
    ],
    correct: 1
  },

  // Riesgo físico
  {
    question: "¿Qué puede causar un ambiente de trabajo caluroso y ruidoso cerca de servidores?",
    answers: [
      "Mayor concentración",
      "Mareos, fatiga y molestias auditivas",
      "Aumento de la creatividad",
      "Reducción del estrés"
    ],
    correct: 1
  },
  {
    question: "¿Cómo se puede mejorar el confort físico en ambientes informáticos?",
    answers: [
      "Ignorando la temperatura",
      "Mejorando ventilación, aislamiento y control ambiental",
      "Aumentando el volumen del servidor",
      "Eliminando toda la luz"
    ],
    correct: 1
  },

  // Riesgo biológico
  {
    question: "¿Qué riesgo existe al trabajar en una oficina con polvo y poca ventilación?",
    answers: [
      "Infecciones, alergias y bajas laborales",
      "Aumenta la productividad",
      "Nada relevante",
      "Solo fatiga visual"
    ],
    correct: 0
  },
  {
    question: "¿Qué ayuda a reducir el riesgo biológico en la oficina?",
    answers: [
      "Limpiar regularmente, ventilar y quedarse en casa si estás enfermo",
      "Abrir todas las ventanas siempre",
      "No usar mascarilla nunca",
      "Beber más café"
    ],
    correct: 0
  },

  // Riesgo químico
  {
    question: "¿Qué puede provocar el uso inadecuado de productos químicos en el mantenimiento informático?",
    answers: [
      "Mejor olor en la oficina",
      "Irritación, intoxicaciones y alergias",
      "Mejor funcionamiento de los equipos",
      "Menos consumo energético"
    ],
    correct: 1
  },
  {
    question: "¿Cómo se previenen los riesgos químicos en la limpieza de equipos?",
    answers: [
      "Utilizando protección, ventilación y leyendo las etiquetas de seguridad",
      "Limpiando sin protección",
      "Ignorando las instrucciones",
      "Solo usando agua"
    ],
    correct: 0
  },

  // Organización del trabajo (psicosocial)
  {
    question: "¿Qué puede ocurrir si hay desorganización y mala comunicación en el equipo?",
    answers: [
      "Estrés, ansiedad y baja motivación",
      "Más tiempo libre",
      "Aumento de sueldo",
      "Trabajo más fácil"
    ],
    correct: 0
  },
  {
    question: "¿Qué recomienda Marge para un ambiente de trabajo saludable?",
    answers: [
      "Evitar la planificación",
      "Planificar, comunicar y priorizar",
      "Dejar las tareas sin terminar",
      "Reducir la comunicación"
    ],
    correct: 1
  },

  // Carga física (Homer y Bart)
  {
    question: "¿Qué riesgo tiene usar una silla sin soporte lumbar y el monitor mal posicionado?",
    answers: [
      "Mejor visión",
      "Dolor de espalda y fatiga visual",
      "Mayor velocidad de trabajo",
      "Ninguno"
    ],
    correct: 1
  },
  {
    question: "¿Qué medida es adecuada para prevenir lesiones por carga física?",
    answers: [
      "No descansar nunca",
      "Monitor a la altura de los ojos y silla ergonómica ajustada",
      "Tener el teclado alto",
      "Trabajar tumbado"
    ],
    correct: 1
  },
  {
    question: "¿Qué puede provocar un teclado mal posicionado?",
    answers: [
      "Síndrome del túnel carpiano y fatiga en muñecas",
      "Mejor postura",
      "Menos errores",
      "Aumenta la motivación"
    ],
    correct: 0
  },
  {
    question: "¿Qué recomienda Bart para cuidar las manos y la postura?",
    answers: [
      "Reposamuñecas, escritorio adaptado y pausas regulares",
      "Solo teclear rápido",
      "No mover las manos",
      "Comer mientras se escribe"
    ],
    correct: 0
  },

  // Carga mental (Lisa)
  {
    question: "¿Qué consecuencia tiene el exceso de carga mental en Lisa?",
    answers: [
      "Aumenta la concentración",
      "Fatiga, errores y bloqueo mental",
      "Mejora la memoria",
      "Más energía"
    ],
    correct: 1
  },
  {
    question: "¿Qué recomienda Lisa para reducir la carga mental?",
    answers: [
      "No descansar nunca",
      "Planificar, priorizar y hacer pausas",
      "Hacer todas las tareas a la vez",
      "Evitar pedir ayuda"
    ],
    correct: 1
  }
];

  let currentIndex = 0;
  let userAnswers = [];
  const quizContainer = document.getElementById('quiz-container');
  const quizSummary = document.getElementById('quiz-summary');
  const summaryQuestions = document.getElementById('summary-questions');
  const exitButton = document.getElementById('exit-button');

  document.getElementById('boss-wrapper').addEventListener('animationend', () => {
    document.getElementById('boss-wrapper').style.display = 'none';
    quizContainer.style.display = 'block';
    renderQuestion();
  });

  function renderQuestion() {
    quizContainer.innerHTML = '';
    if (currentIndex >= questions.length) {
      showSummary(); return;
    }
    const q = questions[currentIndex];
    const questionDiv = document.createElement('div');
    questionDiv.className = 'question-block';
    questionDiv.innerHTML = `<h3>${q.question}</h3>`;
    q.answers.forEach((ans, i) => {
      const btn = document.createElement('button');
      btn.textContent = ans;
      btn.onclick = () => checkAnswer(i, btn, questionDiv, q);
      questionDiv.appendChild(btn);
    });
    quizContainer.appendChild(questionDiv);
  }

  function checkAnswer(selected, btnClicked, questionBlock, q) {
    const isCorrect = selected === q.correct;
    userAnswers.push({ question: q.question, selected, correct: isCorrect });
    const buttons = questionBlock.querySelectorAll('button');
    buttons.forEach((btn, i) => {
      btn.disabled = true;
      if (i === q.correct) btn.classList.add('correct-answer');
      if (i === selected && !isCorrect) btn.classList.add('incorrect');
    });
    if (!isCorrect) questionBlock.classList.add('question-failed');
    setTimeout(() => { currentIndex++; renderQuestion(); }, 2000);
  }

function showSummary() {
  quizContainer.style.display = 'none';
  quizSummary.style.display = 'block';
  summaryQuestions.innerHTML = '';

  questions.forEach((q, index) => {
    const user = userAnswers[index];
    const block = document.createElement('div');
    block.innerHTML = `<h3>${q.question}</h3>`;

    q.answers.forEach((opcion, i) => {
      const respuesta = document.createElement('div');
      respuesta.textContent = opcion;
      respuesta.className = 'respuesta';

      if (i === q.correct) respuesta.classList.add('correct');
      if (i === user.selected && i !== q.correct) respuesta.classList.add('incorrect');

      block.appendChild(respuesta);
    });

    summaryQuestions.appendChild(block);
  });
}


  exitButton.onclick = () => {
    window.location.href = 'mapa.html';
  };
</script>

</body>
</html>
