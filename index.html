<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPE Springfield Intro</title>
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to top, #87ceeb, #d6f0ff);
      height: 100vh;
      overflow: hidden;
      font-family: 'Luckiest Guy', cursive;
      position: relative;
    }

    .nube {
      position: absolute;
      width: 700px;
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .entrada1 { top: 40%; left: 50%; animation: nubeIzquierda 2s ease-in-out forwards; z-index: 5; }
    .entrada2 { top: 55%; left: 50%; animation: nubeDerecha 2s ease-in-out forwards; z-index: 4; }
    .entrada3 { top: 48%; left: 50%; animation: nubeIzquierda2 2.2s ease-in-out forwards; z-index: 3; }
    .entrada4 { top: 35%; left: 50%; animation: nubeDerecha2 2.4s ease-in-out forwards; z-index: 6; }

    .detras {
      animation-duration: 1.5s;
      animation-timing-function: ease-in-out;
      animation-fill-mode: forwards;
      opacity: 0.8;
    }

    .d1 { top: 30%; left: 45%; animation-name: nubeIzquierda; z-index: 1; }
    .d2 { top: 45%; left: 55%; animation-name: nubeDerecha; z-index: 1; }
    .d3 { top: 60%; left: 43%; animation-name: nubeIzquierda2; z-index: 1; }
    .d4 { top: 38%; left: 58%; animation-name: nubeDerecha2; z-index: 1; }
    .d5 { top: 52%; left: 47%; animation-name: nubeIzquierda; z-index: 1; }

    @keyframes nubeIzquierda {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-300%, -50%) scale(1.3); opacity: 0.5; }
    }
    @keyframes nubeIzquierda2 {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-250%, -50%) scale(1.2); opacity: 0.4; }
    }
    @keyframes nubeDerecha {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(300%, -50%) scale(1.3); opacity: 0.5; }
    }
    @keyframes nubeDerecha2 {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(250%, -50%) scale(1.2); opacity: 0.4; }
    }

    h1 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      font-size: 5em;
      color: #ffd90f;
      text-shadow: 4px 4px #000;
      z-index: 10;
      opacity: 0;
      animation: aparecerTitulo 1.2s ease-out 0.8s forwards, zoomLetra 2s ease-in-out 3.8s forwards;
    }

    @keyframes aparecerTitulo {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes zoomLetra {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(20);
        opacity: 0;
      }
    }

    /* Imagen superpuesta para cubrir artefacto visual */
    #pantallaTransicion {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url("/mnt/data/63aad39e-534e-4a74-98fa-95d956ffb08c.png") center center no-repeat;
      background-size: cover;
      display: none;
      z-index: 999;
    }
  </style>
</head>
<body>
  <!-- Nubes principales -->
  <img src="nube3.png" class="nube entrada1" alt="nube" />
  <img src="nube1.png" class="nube entrada2" alt="nube" />
  <img src="nube1.png" class="nube entrada3" alt="nube" />
  <img src="nube2.png" class="nube entrada4" alt="nube" />

  <!-- Nubes detrás del título -->
  <img src="nube1.png" class="nube detras d1" alt="nube" />
  <img src="nube2.png" class="nube detras d2" alt="nube" />
  <img src="nube3.png" class="nube detras d3" alt="nube" />
  <img src="nube2.png" class="nube detras d4" alt="nube" />
  <img src="nube1.png" class="nube detras d5" alt="nube" />

  <!-- Título -->
  <h1>Riesgos laborales</h1>

  <!-- Pantalla de transición visual -->
  <div id="pantallaTransicion"></div>

  <script>
    // Mostrar imagen de transición justo antes de cambiar de página
    setTimeout(() => {
      document.getElementById("pantallaTransicion").style.display = "block";
    }, 5500);

    // Cambio de página
    setTimeout(() => {
      window.location.href = "mapa.html";
    }, 5700);
  </script>
</body>
</html>
